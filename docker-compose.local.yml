# Run the screener on your own computer against the same Neon database as the Vercel site.
# Pages show stored data only; the heavy loads keep running on GitHub Actions (as on Vercel).
#   1. copy .env.local.example to .env.local and fill it in
#   2. docker compose -f docker-compose.local.yml up -d --build
#   3. open http://localhost:3000
services:
  api:
    build: ./backend
    env_file: .env.local
    environment:
      JOBS_ON_GITHUB: "1"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        JOBS_ON_GITHUB: "1"
        BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on: [api]
    restart: unless-stopped
