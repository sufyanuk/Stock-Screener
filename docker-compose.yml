# Stock Intel — full stack.   cp .env.example .env  →  edit  →  docker compose up -d --build
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stockintel}:${POSTGRES_PASSWORD}@db:5432/stockintel
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stockintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: stockintel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stockintel}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  api:
    <<: *backend
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on: [api]

  beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on: [api]

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
    restart: unless-stopped

  # Nightly pg_dump into ./backups (keep the newest 14 dumps; prune older ones yourself or with a cron job)
  backup:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U ${POSTGRES_USER:-stockintel} -Fc stockintel > /backups/stockintel-$$(date +%F).dump; sleep 86400; done"]
    volumes: [./backups:/backups]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
